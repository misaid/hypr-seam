# hypr-seam example config (plain hyprlang .conf)
#
# This is a copy-paste starting point, not something to use verbatim. It
# shows every plugin:seam:* value hypr-seam registers, set explicitly to
# its real built-in default, with a comment explaining what it does. Most
# users will only want to override a handful of these (commonly just
# enabled, and maybe rounding) -- delete the rest once you've picked your
# values, or leave them as documentation of what's tunable.
#
# Requires decoration:rounding = 0 in your Hyprland config: this plugin
# fully replaces native corner rendering, so leaving native rounding on
# will double up with (or fight) hypr-seam's own rounding.
decoration:rounding = 0

# Uniform base corner radius used for any corner that doesn't have its
# own rounding_* override below. This is the radius windows render at
# when the seam effect isn't flattening them.
plugin:seam:rounding = 22

# Per-corner base radius overrides. Each one falls back to `rounding`
# above when left unset, so you only need to set the corners you want to
# differ. Commented out here since they already equal the default.
# plugin:seam:rounding_topleft = 22
# plugin:seam:rounding_topright = 22
# plugin:seam:rounding_bottomleft = 22
# plugin:seam:rounding_bottomright = 22

# Squircle exponent for the corner curve shape. 2.0 matches a regular
# rounded-rectangle curve (Hyprland's native look). Raise it for a more
# squared-off "squircle" corner.
plugin:seam:rounding_power = 2.0

# Global master switch for the seam effect. When false, windows just
# render with ordinary per-corner rounding and nothing ever flattens,
# regardless of adjacency.
plugin:seam:enabled = false

# Radius a corner collapses to once it's flagged as touching a
# neighboring tiled window (a book-seam corner instead of a fully
# rounded one).
plugin:seam:seam_radius = 2

# Maximum gap, in pixels, between two window edges that still counts as
# "touching" for seam purposes. -1 (the default) derives this from
# general:gaps_in automatically; set an explicit value only if the auto
# default doesn't match your layout.
plugin:seam:tolerance = -1

# Eases a corner's radius between its base and seam values instead of
# snapping instantly when adjacency changes.
plugin:seam:animate = true

# Duration, in milliseconds, of that easing transition.
plugin:seam:animation_speed = 300

# Name of a bezier curve already registered via a `bezier =` line (or
# hl.curve(...) in a Lua config) to drive the easing above. "default" is
# Hyprland's built-in curve.
plugin:seam:animation_curve = default

# Also round a window's subsurfaces where they reach the window's own
# corners. Turn this on if Firefox-based browsers (Firefox, Zen, ...)
# keep square corners: they draw the whole window into a subsurface that
# hides the rounded main surface. Off by default because it affects how
# every app's subsurfaces are drawn.
plugin:seam:force_round_risky_surfaces = false

# Off by default. Round the native border to match this window's live
# corner radii (including seam flattening). Only visible with
# general:border_size > 0.
plugin:seam:round_borders = false

# Off by default. Round the native drop shadow the same way. Only
# visible with decoration:shadow:enabled = true.
plugin:seam:round_shadows = false

# Per-app rules (seamrule)
#
# Hyprland's plugin API has no hook into the native windowrulev2 engine,
# so hypr-seam parses its own `seamrule` keyword using the same
# class:/title: match syntax as windowrulev2. Later rules win on conflict,
# same as windowrulev2.

# Give kitty sharper top corners and keep its bottom corners at the
# global default, independent of plugin:seam:rounding above.
seamrule = rounding 4 4 22 22, class:^(kitty)$

# Opt foot out of the seam effect even if plugin:seam:enabled is true.
seamrule = seam 0, class:^(foot)$

# Force mpv to always participate in the seam effect, even if
# plugin:seam:enabled is false globally.
seamrule = seam 1, class:^(mpv)$

# Force a window to never flatten, useful for floating-like windows such
# as a picture-in-picture player that shouldn't visually merge with
# whatever tiled window it happens to sit next to.
seamrule = seam 0, title:^Picture-in-Picture$
